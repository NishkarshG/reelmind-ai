# Netlify hosts the React frontend. Netlify cannot run Python, so the FastAPI
# backend runs on Render (see render.yaml) and the frontend calls it directly.
# For a backend-less, read-only preview of the demo workspace instead, set
# VITE_STATIC_DEMO = "1" and remove VITE_API_URL.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_STATIC_DEMO = "0"
  VITE_API_URL = "https://reelmind-api.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
